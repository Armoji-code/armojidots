; GameMode: requested by games (via gamemoderun or auto-detected by Steam/
; Proton) to pin the CPU governor to performance and reduce scheduling
; jitter for the game process while it's running — the fix for "power
; profile is already maxed but framerate is still jumpy" (BeamNG.drive is
; single-thread-bound on its physics sim, so scheduling consistency matters
; as much as raw clocks).
[general]
; bump the game process's scheduling priority (nice -10); requires being in
; the "gamemode" group (see: sudo usermod -aG gamemode $USER, then re-login)
renice=10
