# style pack "material" · sway. Blur flags on every layer stay identical across
# packs (SwayFX segfaults on a live reload that flips them); only passes,
# radii and shadows differ. Layer corner_radius = the shell's radius tokens.
corner_radius 16
smart_corner_radius off

shadows enable
shadow_blur_radius 18
shadow_color #00000070
shadow_inactive_color #00000040

default_dim_inactive 0.1

blur enable
blur_passes 3
blur_radius 6

layer_effects "waybar" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 0
layer_effects "armoji-bar" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 0
layer_effects "armoji-sidebar" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 28
layer_effects "spotlight-search" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 20
layer_effects "spotlight-list" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 28
layer_effects "armoji-notif" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 24
layer_effects "armoji-notif-center" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 28
layer_effects "armoji-dock" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 0
layer_effects "armoji-osd" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 0
