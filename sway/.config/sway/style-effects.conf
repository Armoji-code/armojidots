# generated by theme.sh — style: nothingos
# style pack "nothingos" · sway — flat: no shadows, technical radii.
# Blur settings deliberately match the default pack: SwayFX segfaults on a live
# reload that flips a layer's blur/blur_ignore_transparent off. Nothing's
# surfaces are opaque, so blur is invisible anyway.
# Layer corner_radius values match this pack's CSS border-radius.
corner_radius 12
smart_corner_radius off

shadows disable
shadow_blur_radius 18
shadow_color #00000070
shadow_inactive_color #00000040

default_dim_inactive 0.1

blur enable
blur_passes 2
blur_radius 4

layer_effects "waybar" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 0
layer_effects "walker" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 16
layer_effects "spotlight-search" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 20
layer_effects "spotlight-list" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 16
layer_effects "swaync-notification-window" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 16
layer_effects "swaync-control-center" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 20
layer_effects "armoji-dock" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 0
layer_effects "armoji-osd" blur enable; blur_ignore_transparent enable; shadows disable; corner_radius 14
