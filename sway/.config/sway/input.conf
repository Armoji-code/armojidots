# ── Input ───────────────────────────────────────────

# Touchpad: Windows-style scrolling (down motion scrolls up),
# tap-to-click left as hardware default
input type:touchpad {
    natural_scroll enabled
    dwt disabled
}

# Mice: classic wheel (wheel down = page down), like Windows.
# accel_profile flat = no acceleration curve, pure 1:1 speed.
# pointer_accel range is -1 (slowest) to 1 (fastest), 0 = default —
# with flat this just scales the flat speed, no curve involved.
input type:pointer {
    natural_scroll disabled
    accel_profile flat
    pointer_accel -0.4
}

# Keyboard layout: EN/LT, toggled with Shift+Alt (native xkb chord — sway
# bindsym can't cleanly bind a bare modifier-only combo) or the waybar
# language button (lang.sh). lang.sh watches for the resulting sway IPC
# event and fires a switch notification either way.
input type:keyboard {
    xkb_layout "us,lt"
    xkb_options "grp:alt_shift_toggle"
}

# Cursor theme (Bibata-Modern-Classic) — sets it for native Wayland clients;
# XCURSOR_THEME/SIZE (environment.d/cursor.conf) covers X11/XWayland apps and
# anything reading the env instead of the seat.
seat seat0 xcursor_theme Bibata-Modern-Classic 24
