# ── Autostart ───────────────────────────────────────
# Things that launch with the session.

# Hand the session environment to systemd user services (they need
# WAYLAND_DISPLAY to show GUI), then (re)start them with it:
#   elephant = launcher data backend for Spotlight (the shell). walker isn't
#   resident any more — only the theme/wallpaper dmenu pickers start it.
# Restarting here guarantees it comes up with the session environment;
# the unit is also WantedBy=graphical-session.target and Restart=on-failure.
exec 'systemctl --user import-environment WAYLAND_DISPLAY DISPLAY SWAYSOCK XDG_CURRENT_DESKTOP XDG_SESSION_TYPE; dbus-update-activation-environment --systemd WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP; systemctl --user restart elephant'

exec autotiling
# Quickshell shell (shell/ package: bar, dock, OSD, spotlight); Waybar stays installed as the fallback:
#   pkill -x qs; swaymsg exec waybar
exec qs -c armoji-shell
exec swaync
# walker frontend runs as a systemd user service (started in the env-import
# line above) so it stays resident — the launcher window opens instantly.
# idle policy lives in swayidle/config (auto-discovered): 5m lock, 10m screen off
exec swayidle -w
# "current" is a symlink updated by spotlight's /wallpaper
exec swaybg -i ~/dotfiles/wallpapers/current -m fill
# External display = duplicate of the laptop panel (re-applied on every hotplug)
exec ~/.config/sway/scripts/mirror-watch.sh
# blue-light filter: re-apply the saved ON/OFF/AUTO state (default: auto)
exec ~/.config/waybar/scripts/bluelight.sh startup
# Caps Lock / Num Lock toggle notifications
exec ~/.config/sway/scripts/lock-watch.sh
# Jump-to-window-on-urgent, with per-app exceptions (see rules.conf)
exec_always ~/.config/sway/scripts/activation-watch.sh
# Low battery notifications (20/10/5%)
exec ~/.config/sway/scripts/battery-watch.sh
