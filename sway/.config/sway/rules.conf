# ── Window rules ────────────────────────────────────

# When an app requests focus (urgent hint / xdg_activation), actually jump
# to it instead of just marking its border urgent (client.urgent, red) and
# waiting — sway's default ("smart") only auto-focuses if you're already on
# its workspace, otherwise it just flashes. Left at "urgent" (flash only)
# here on purpose: focus_on_window_activation is a single global directive,
# sway has no per-app override, so the actual jump-to-it behavior is
# reimplemented in scripts/activation-watch.sh (autostart), which reacts to
# the same urgent hint per-window and can skip apps like Viber that ping it
# on every single message (see the viber rules below).
focus_on_window_activation urgent

# Floating glass terminals for TUI tools (nmtui, bluetuith, …)
for_window [app_id="float-tui"] floating enable, resize set 900 px 620 px, move position center

# Sidebar terminals: scratchpad-backed; position/size (Win+Shift+Arrows /
# Win+Arrows) are owned by scripts/sidebar-control.sh, not set here
for_window [app_id="sidebar-term"] floating enable, sticky enable, move scratchpad, scratchpad show
for_window [app_id="sidebar-claude"] floating enable, sticky enable, move scratchpad, scratchpad show

# Zen Browser's pop-out Picture-in-Picture video: float it and keep it
# visible across every workspace. NOTE: it can NOT be made to render above a
# fullscreen window — confirmed against sway upstream (swaywm/sway#4797,
# #6799): a normal toplevel can never draw over fullscreen, it's baked into
# the xdg-shell protocol itself, not a sway config gap. Only wlr-layer-shell
# "overlay"-layer surfaces are exempt, and PiP isn't one of those.
for_window [app_id="zen" title="^Picture-in-Picture$"] floating enable, sticky enable

# Viber (flatpak): its "new message" toast is a SEPARATE small floating
# window (app_id="viber", title="ViberPC", ~294x118px, centered) distinct
# from the main "Rakuten Viber" window — kill it on sight so only swaync's
# copy of the notification (Viber also talks to the notification portal,
# confirmed via its flatpak permissions) is visible. Its main window is
# also excluded from the auto-teleport-on-urgent behavior above (see
# scripts/activation-watch.sh) since it pings urgent on every message.
for_window [app_id="viber" title="^ViberPC$"] kill

# GTK apps join the glass: slight transparency + SwayFX blur behind
for_window [app_id="nemo"] opacity 0.93
for_window [app_id="org.pulseaudio.pavucontrol"] opacity 0.93

# Monitor config (nwg-displays): floats + centers instead of tiling in, and
# focuses right here at map time (a follow-up `swaymsg … focus` from the
# launching script races the window actually mapping and unreliably no-ops)
for_window [app_id="nwg-displays"] floating enable, resize set 900 px 650 px, move position center, focus

# Spotlight launcher: both windows are layer-shell surfaces now (see
# effects.conf's "spotlight-search"/"spotlight-list" layer_effects rules for
# their glass) — no for_window rule needed, layer surfaces aren't managed by
# floating/tiling window rules.
