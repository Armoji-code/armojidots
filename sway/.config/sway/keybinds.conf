# ── Keybinds ────────────────────────────────────────

# Apps
bindsym $mod+t exec $term
bindsym $mod+e exec $files
bindsym $mod+w exec $browser

# Spotlight (custom launcher — armoji-spotlight)
bindsym $mod+d exec armoji-spotlight

# Window controls
bindsym $mod+q kill
bindsym $mod+space floating toggle
bindsym $mod+f fullscreen toggle

# Lock screen
bindsym $mod+l exec swaylock -f

# Notification center
bindsym $mod+n exec swaync-client -t

# Quick-access sidebar terminals (toggle shows/hides, never kills)
bindsym $mod+r exec ~/.config/sway/scripts/sidebar.sh term
bindsym $mod+Shift+r exec ~/.config/sway/scripts/sidebar.sh claude

# Sidebar dock edge + size (acts on whichever sidebar was shown/toggled
# most recently). Confirmed sway just doesn't see Win(+Shift)+Arrow on this
# hardware (vim keys work fine as a direct swap), so Win+Arrow is freed up
# below for regular window move/resize instead:
#   h = toggle within the current axis (left<->right, or top<->bottom)
#   m = switch axis: sides (left/right) <-> middle (top/bottom)
#   v = cycle size: default -> half -> full -> default
bindsym $mod+Shift+h exec ~/.config/sway/scripts/sidebar-control.sh toggle-sides
bindsym $mod+Shift+m exec ~/.config/sway/scripts/sidebar-control.sh toggle-mode
bindsym $mod+Shift+v exec ~/.config/sway/scripts/sidebar-control.sh toggle-size

# General window move/resize (native sway)
bindsym $mod+Left  move left
bindsym $mod+Right move right
bindsym $mod+Up    move up
bindsym $mod+Down  move down
bindsym $mod+Shift+Left  resize shrink width 20px
bindsym $mod+Shift+Right resize grow width 20px
bindsym $mod+Shift+Up    resize shrink height 20px
bindsym $mod+Shift+Down  resize grow height 20px

# Screenshot: select a region → clipboard + notification with thumbnail
bindsym $mod+Shift+s exec sh -c 'f=/tmp/armoji-screenshot.png; grim -g "$(slurp)" "$f" && wl-copy --type image/png < "$f" && notify-send -t 3000 -h "string:image-path:file://$f" "󰹑 Screenshot" "Region copied to clipboard"'

# Hold Win + left-drag to move windows, Win + right-drag to resize
floating_modifier $mod normal
