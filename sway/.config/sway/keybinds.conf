# ── Keybinds ────────────────────────────────────────

# Apps
bindsym $mod+t exec $term
bindsym $mod+e exec $files
bindsym $mod+w exec $browser

# Spotlight (custom launcher — armoji-spotlight)
bindsym $mod+d exec armoji-spotlight

# Window controls
bindsym $mod+q kill
bindsym $mod+space floating toggle
bindsym $mod+f fullscreen toggle

# Lock screen
bindsym $mod+l exec swaylock -f

# Notification center
bindsym $mod+n exec swaync-client -t

# Quick-access sidebar terminals (toggle shows/hides, never kills)
bindsym $mod+r exec ~/.config/sway/scripts/sidebar.sh term
bindsym $mod+Shift+r exec ~/.config/sway/scripts/sidebar.sh claude

# Sidebar dock edge — left/right stay vertical, up/down flip horizontal
# (acts on whichever sidebar was shown/toggled most recently)
bindsym $mod+Shift+Left  exec ~/.config/sway/scripts/sidebar-control.sh position left
bindsym $mod+Shift+Right exec ~/.config/sway/scripts/sidebar-control.sh position right
bindsym $mod+Shift+Up    exec ~/.config/sway/scripts/sidebar-control.sh position top
bindsym $mod+Shift+Down  exec ~/.config/sway/scripts/sidebar-control.sh position bottom

# Sidebar size — 3 stages: default (25%) -> half -> full. Direction is
# relative to dock position: whichever arrow points toward screen center
# grows it (sidebar-control.sh works out grow vs shrink from the dock edge)
bindsym $mod+Up    exec ~/.config/sway/scripts/sidebar-control.sh resize up
bindsym $mod+Right exec ~/.config/sway/scripts/sidebar-control.sh resize right
bindsym $mod+Down  exec ~/.config/sway/scripts/sidebar-control.sh resize down
bindsym $mod+Left  exec ~/.config/sway/scripts/sidebar-control.sh resize left

# Screenshot: select a region → clipboard + notification with thumbnail
bindsym $mod+Shift+s exec sh -c 'f=/tmp/armoji-screenshot.png; grim -g "$(slurp)" "$f" && wl-copy --type image/png < "$f" && notify-send -t 3000 -h "string:image-path:file://$f" "󰹑 Screenshot" "Region copied to clipboard"'

# Hold Win + left-drag to move windows, Win + right-drag to resize
floating_modifier $mod normal
