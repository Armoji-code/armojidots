# ── armojidots · kitty ──────────────────────────────
# Used for the sidebars — a NORMAL window (scratchpad show/hide, same as
# foot before it), not kitty's quick-access-terminal/layer-shell kitten:
# that had a real, persistent blur artifact on the hide transition.
# Colors come from theme-colors.conf, generated by theme.sh (/set color)
include theme-colors.conf

font_family JetBrainsMono Nerd Font
font_size 13

# cursor trail animation — the reason kitty over foot
cursor_trail 20
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

cursor_shape beam
cursor_blink_interval 0.5

scrollback_lines 10000

background_opacity 0.88
