# ── armojidots · kitty ──────────────────────────────
# Colors come from theme-colors.conf, generated by theme.sh (/colors)
include theme-colors.conf
# font, opacity, padding, cursor shape: the active style pack
# (styles/<pack>/kitty.conf → style.conf, generated by theme.sh)
include style.conf

# fish (greeting + starship) without changing the login shell
shell fish

# cursor trail animation
cursor_trail 20
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

scrollback_lines 10000
